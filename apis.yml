name: ShadowBot

image: https://shadowbot.tech/opengraph-image?5d0623eb3eac3e38

description: ShadowBot is a free browser gaming platform offering thousands of HTML5 games that can be played instantly without downloads or installations.
  It provides a wide catalog ranging from arcade classics to puzzles, racing, and strategy games, supporting daily challenges, tournaments, and
  community features like clans and leaderboards. The service aims to make gaming accessible to everyone across devices, with a focus on easy
  access and a vibrant collection for casual and dedicated players alike.

